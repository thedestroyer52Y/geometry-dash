<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Rift: Hyper Dash</title>
  <style>
    :root {
      --bg: #04010e;
      --panel: rgba(15, 20, 48, 0.75);
      --neon-cyan: #49f3ff;
      --neon-magenta: #ff4fd8;
      --neon-yellow: #ffe86a;
      --danger: #ff3f6c;
      --safe: #55ff9b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, #1a1f4f 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, #350f4f 0%, transparent 35%),
        var(--bg);
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    #game-wrap {
      position: relative;
      width: min(100vw, 1100px);
      height: min(100vh, 720px);
      padding: 12px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      background: linear-gradient(to bottom, rgba(8,6,30,0.9), rgba(4,1,14,1));
      box-shadow: 0 0 35px rgba(73,243,255,0.24), 0 0 55px rgba(255,79,216,0.15) inset;
    }

    .hud {
      position: absolute;
      inset: 24px 24px auto 24px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(0,0,0,0.65);
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 14px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      background: rgba(2, 2, 10, 0.55);
      color: white;
      border-radius: 14px;
      padding: 24px;
    }

    #overlay.hidden { display: none; }

    h1 { margin: 0 0 10px; letter-spacing: 1px; }
    p { margin: 8px 0; opacity: 0.95; }

    .key {
      display: inline-block;
      min-width: 26px;
      padding: 2px 6px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      margin: 0 2px;
      font-weight: 700;
      background: rgba(255,255,255,0.12);
    }

    button {
      margin-top: 16px;
      border: none;
      color: #04010e;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
      font-size: 1rem;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(73,243,255,0.35);
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="1100" height="720"></canvas>

    <div class="hud">
      <div class="panel" id="left-hud"></div>
      <div class="panel" id="right-hud"></div>
    </div>

    <div id="overlay">
      <div>
        <h1>Neon Rift: Hyper Dash</h1>
        <p>Dash through rift storms, build combo chains, and survive escalating AI hunters.</p>
        <p>
          Move <span class="key">WASD</span> / <span class="key">↑↓←→</span>,
          Shoot <span class="key">Mouse</span> / <span class="key">Space</span>,
          Dash <span class="key">Shift</span>,
          Pulse Nova <span class="key">E</span>.
        </p>
        <p>Collect core shards to level up and auto-upgrade your ship.</p>
        <button id="start">Launch Run</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start');
    const leftHud = document.getElementById('left-hud');
    const rightHud = document.getElementById('right-hud');

    const game = {
      running: false,
      time: 0,
      score: 0,
      combo: 1,
      comboTimer: 0,
      wave: 1,
      danger: 1,
      mouse: { x: canvas.width / 2, y: canvas.height / 2 },
      keys: new Set(),
      bullets: [],
      enemies: [],
      particles: [],
      shards: [],
      stars: Array.from({ length: 180 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: Math.random() * 2 + 0.4
      })),
      player: null,
      spawnClock: 0,
      shootClock: 0,
      pulseClock: 0,
      screenShake: 0,
    };

    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function resetGame() {
      game.time = 0;
      game.score = 0;
      game.combo = 1;
      game.comboTimer = 0;
      game.wave = 1;
      game.danger = 1;
      game.bullets = [];
      game.enemies = [];
      game.particles = [];
      game.shards = [];
      game.spawnClock = 0;
      game.shootClock = 0;
      game.pulseClock = 0;
      game.screenShake = 0;

      game.player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        r: 18,
        hp: 100,
        maxHp: 100,
        shield: 40,
        maxShield: 40,
        shieldRegen: 8,
        speed: 320,
        accel: 1700,
        fireRate: 0.14,
        bulletSpeed: 840,
        bulletDamage: 22,
        level: 1,
        xp: 0,
        xpToLevel: 80,
        dashTimer: 0,
        dashCooldown: 0,
        invuln: 0,
        pulseCharges: 2,
        pulseMax: 2,
        pulseRegen: 7,
      };
    }

    function spawnEnemy() {
      const edge = Math.floor(Math.random() * 4);
      const pad = 40;
      let x = 0, y = 0;
      if (edge === 0) { x = rand(0, canvas.width); y = -pad; }
      if (edge === 1) { x = canvas.width + pad; y = rand(0, canvas.height); }
      if (edge === 2) { x = rand(0, canvas.width); y = canvas.height + pad; }
      if (edge === 3) { x = -pad; y = rand(0, canvas.height); }

      const tier = Math.random();
      const stats = tier < 0.62
        ? { r: 14, hp: 34 + game.wave * 3, speed: 110 + game.wave * 7, color: '#ff4fd8', points: 22 }
        : tier < 0.9
        ? { r: 19, hp: 75 + game.wave * 6, speed: 85 + game.wave * 4, color: '#49f3ff', points: 45 }
        : { r: 26, hp: 160 + game.wave * 12, speed: 68 + game.wave * 3, color: '#ffe86a', points: 95 };

      game.enemies.push({ x, y, vx: 0, vy: 0, ...stats, hitFlash: 0 });
    }

    function levelUp() {
      const p = game.player;
      p.level++;
      p.xp = 0;
      p.xpToLevel = Math.floor(p.xpToLevel * 1.32);

      const options = [
        () => { p.maxHp += 14; p.hp = Math.min(p.maxHp, p.hp + 24); },
        () => { p.maxShield += 8; p.shield = p.maxShield; },
        () => { p.fireRate *= 0.92; },
        () => { p.bulletDamage += 5; },
        () => { p.speed += 22; },
        () => { p.pulseMax += 1; p.pulseCharges = p.pulseMax; }
      ];
      options[Math.floor(Math.random() * options.length)]();

      for (let i = 0; i < 35; i++) {
        game.particles.push({
          x: p.x, y: p.y,
          vx: rand(-220, 220), vy: rand(-220, 220),
          life: rand(0.35, 0.9),
          size: rand(2, 5),
          color: '#55ff9b'
        });
      }
    }

    function shoot(targetX, targetY) {
      const p = game.player;
      const ang = Math.atan2(targetY - p.y, targetX - p.x);
      const spread = rand(-0.045, 0.045);
      const a = ang + spread;
      game.bullets.push({
        x: p.x + Math.cos(a) * 22,
        y: p.y + Math.sin(a) * 22,
        vx: Math.cos(a) * p.bulletSpeed,
        vy: Math.sin(a) * p.bulletSpeed,
        life: 1.2,
        dmg: p.bulletDamage,
      });
    }

    function pulseNova() {
      const p = game.player;
      if (p.pulseCharges < 1) return;
      p.pulseCharges -= 1;

      for (const e of game.enemies) {
        const d = dist(p, e);
        if (d < 210) {
          const factor = 1 - d / 210;
          e.hp -= 30 + 80 * factor;
          const knock = 380 * factor;
          const a = Math.atan2(e.y - p.y, e.x - p.x);
          e.vx += Math.cos(a) * knock;
          e.vy += Math.sin(a) * knock;
          e.hitFlash = 0.15;
        }
      }

      game.screenShake = Math.max(game.screenShake, 12);
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * Math.PI * 2;
        const speed = rand(120, 430);
        game.particles.push({
          x: p.x, y: p.y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          life: rand(0.35, 0.8),
          size: rand(1.8, 4.2),
          color: i % 2 ? '#49f3ff' : '#ff4fd8'
        });
      }
    }

    function update(dt) {
      const p = game.player;
      game.time += dt;
      game.comboTimer = Math.max(0, game.comboTimer - dt);
      if (game.comboTimer === 0) game.combo = 1;

      p.shield = Math.min(p.maxShield, p.shield + p.shieldRegen * dt);
      p.pulseRegenTimer = (p.pulseRegenTimer || 0) + dt;
      if (p.pulseRegenTimer > p.pulseRegen) {
        p.pulseRegenTimer = 0;
        p.pulseCharges = Math.min(p.pulseMax, p.pulseCharges + 1);
      }

      const up = game.keys.has('w') || game.keys.has('arrowup');
      const down = game.keys.has('s') || game.keys.has('arrowdown');
      const left = game.keys.has('a') || game.keys.has('arrowleft');
      const right = game.keys.has('d') || game.keys.has('arrowright');

      const dx = (right ? 1 : 0) - (left ? 1 : 0);
      const dy = (down ? 1 : 0) - (up ? 1 : 0);
      const len = Math.hypot(dx, dy) || 1;

      p.vx += (dx / len) * p.accel * dt;
      p.vy += (dy / len) * p.accel * dt;

      const drag = Math.exp(-6 * dt);
      p.vx *= drag;
      p.vy *= drag;

      const maxSpeed = p.speed * (p.dashTimer > 0 ? 2.8 : 1);
      const vmag = Math.hypot(p.vx, p.vy);
      if (vmag > maxSpeed) {
        p.vx = (p.vx / vmag) * maxSpeed;
        p.vy = (p.vy / vmag) * maxSpeed;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = clamp(p.x, p.r, canvas.width - p.r);
      p.y = clamp(p.y, p.r, canvas.height - p.r);

      p.dashTimer = Math.max(0, p.dashTimer - dt);
      p.dashCooldown = Math.max(0, p.dashCooldown - dt);
      p.invuln = Math.max(0, p.invuln - dt);

      game.shootClock -= dt;
      const firing = game.keys.has(' ') || game.mouse.down;
      if (firing && game.shootClock <= 0) {
        shoot(game.mouse.x, game.mouse.y);
        game.shootClock = p.fireRate;
      }

      game.spawnClock -= dt;
      if (game.spawnClock <= 0) {
        const base = Math.max(0.18, 1.1 - game.wave * 0.04);
        game.spawnClock = rand(base * 0.65, base * 1.2);
        spawnEnemy();
        if (Math.random() < 0.24 + game.wave * 0.01) spawnEnemy();
      }

      if (Math.floor(game.time / 18) + 1 > game.wave) {
        game.wave++;
        game.danger += 0.25;
      }

      for (const b of game.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
      }
      game.bullets = game.bullets.filter(b => b.life > 0 && b.x > -40 && b.x < canvas.width + 40 && b.y > -40 && b.y < canvas.height + 40);

      for (const e of game.enemies) {
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        const chase = e.speed * (1 + game.danger * 0.05);
        e.vx += Math.cos(a) * chase * dt;
        e.vy += Math.sin(a) * chase * dt;
        e.vx *= Math.exp(-3.2 * dt);
        e.vy *= Math.exp(-3.2 * dt);
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        e.hitFlash = Math.max(0, e.hitFlash - dt);
      }

      for (const b of game.bullets) {
        for (const e of game.enemies) {
          if (dist(b, e) < e.r + 4) {
            e.hp -= b.dmg;
            e.hitFlash = 0.12;
            b.life = 0;
            for (let i = 0; i < 8; i++) {
              game.particles.push({
                x: b.x, y: b.y,
                vx: rand(-180, 180), vy: rand(-180, 180),
                life: rand(0.2, 0.5),
                size: rand(1.6, 3.6),
                color: e.color
              });
            }
            break;
          }
        }
      }

      for (const e of game.enemies) {
        if (dist(e, p) < e.r + p.r && p.invuln <= 0) {
          const dmg = 12 + game.wave * 1.4;
          if (p.shield > 0) p.shield -= dmg;
          else p.hp -= dmg;
          p.invuln = 0.45;
          game.screenShake = Math.max(game.screenShake, 10);
          const a = Math.atan2(p.y - e.y, p.x - e.x);
          p.vx += Math.cos(a) * 260;
          p.vy += Math.sin(a) * 260;
        }
      }

      const dead = [];
      game.enemies = game.enemies.filter(e => {
        if (e.hp <= 0) { dead.push(e); return false; }
        return true;
      });

      for (const e of dead) {
        game.score += Math.floor(e.points * game.combo);
        game.combo = Math.min(9.5, game.combo + 0.15);
        game.comboTimer = 2.8;
        for (let i = 0; i < 20; i++) {
          game.particles.push({
            x: e.x, y: e.y,
            vx: rand(-250, 250), vy: rand(-250, 250),
            life: rand(0.3, 0.9),
            size: rand(2, 5),
            color: e.color
          });
        }
        game.shards.push({ x: e.x, y: e.y, vx: rand(-90, 90), vy: rand(-90, 90), value: 16 + e.r });
      }

      for (const s of game.shards) {
        const a = Math.atan2(p.y - s.y, p.x - s.x);
        const d = dist(s, p);
        const pull = d < 190 ? (220 + (190 - d) * 6) : 0;
        s.vx += Math.cos(a) * pull * dt;
        s.vy += Math.sin(a) * pull * dt;
        s.vx *= Math.exp(-2.5 * dt);
        s.vy *= Math.exp(-2.5 * dt);
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        if (d < p.r + 10) {
          p.xp += s.value;
          s.collected = true;
          for (let i = 0; i < 5; i++) {
            game.particles.push({ x: s.x, y: s.y, vx: rand(-70, 70), vy: rand(-70, 70), life: rand(0.2, 0.45), size: rand(1, 2.5), color: '#55ff9b' });
          }
        }
      }
      game.shards = game.shards.filter(s => !s.collected);

      if (p.xp >= p.xpToLevel) levelUp();

      for (const part of game.particles) {
        part.x += part.vx * dt;
        part.y += part.vy * dt;
        part.life -= dt;
      }
      game.particles = game.particles.filter(part => part.life > 0);

      game.screenShake = Math.max(0, game.screenShake - dt * 18);

      if (p.hp <= 0) {
        game.running = false;
        overlay.classList.remove('hidden');
        overlay.querySelector('h1').textContent = 'Run Ended';
        overlay.querySelector('p').textContent = `Score ${Math.floor(game.score)} | Wave ${game.wave} | Level ${p.level}`;
        startBtn.textContent = 'Try Again';
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const shakeX = rand(-game.screenShake, game.screenShake);
      const shakeY = rand(-game.screenShake, game.screenShake);
      ctx.save();
      ctx.translate(shakeX, shakeY);

      for (const st of game.stars) {
        st.y += st.z * (1.1 + game.danger * 0.08);
        if (st.y > canvas.height) { st.y = -2; st.x = Math.random() * canvas.width; }
        ctx.fillStyle = `rgba(73,243,255,${0.25 + st.z * 0.35})`;
        ctx.fillRect(st.x, st.y, st.z, st.z * 1.8);
      }

      for (const s of game.shards) {
        ctx.fillStyle = '#55ff9b';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const b of game.bullets) {
        ctx.strokeStyle = '#49f3ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02);
        ctx.stroke();
      }

      for (const e of game.enemies) {
        ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();

        const hpW = e.r * 1.6;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - hpW / 2, e.y - e.r - 12, hpW, 4);
        ctx.fillStyle = '#55ff9b';
        const hpRatio = clamp(e.hp / (160 + game.wave * 12), 0, 1);
        ctx.fillRect(e.x - hpW / 2, e.y - e.r - 12, hpW * hpRatio, 4);
      }

      for (const part of game.particles) {
        ctx.fillStyle = part.color;
        ctx.globalAlpha = clamp(part.life * 1.6, 0, 1);
        ctx.beginPath();
        ctx.arc(part.x, part.y, part.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const p = game.player;
      if (p) {
        const ang = Math.atan2(game.mouse.y - p.y, game.mouse.x - p.x);

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(ang);

        ctx.fillStyle = p.invuln > 0 ? '#ffffff' : '#49f3ff';
        ctx.beginPath();
        ctx.moveTo(24, 0);
        ctx.lineTo(-14, 11);
        ctx.lineTo(-8, 0);
        ctx.lineTo(-14, -11);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ff4fd8';
        ctx.fillRect(-10, -3, 14, 6);
        ctx.restore();

        if (p.dashTimer > 0) {
          ctx.strokeStyle = 'rgba(73,243,255,0.5)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      ctx.restore();

      if (!game.running) return;

      const hpRatio = clamp(p.hp / p.maxHp, 0, 1);

      leftHud.innerHTML = `
        <div>HP: <b style="color:${hpRatio < 0.3 ? 'var(--danger)' : 'var(--safe)'}">${Math.ceil(p.hp)}</b> / ${p.maxHp}</div>
        <div>Shield: <b style="color:var(--neon-cyan)">${Math.ceil(p.shield)}</b> / ${p.maxShield}</div>
        <div>Level ${p.level} — XP ${Math.floor(p.xp)} / ${p.xpToLevel}</div>
      `;

      rightHud.innerHTML = `
        <div>Score: <b>${Math.floor(game.score)}</b></div>
        <div>Wave: <b>${game.wave}</b> | Combo: <b>x${game.combo.toFixed(1)}</b></div>
        <div>Pulse Nova: <b>${p.pulseCharges}</b> | Dash: <b>${p.dashCooldown <= 0 ? 'Ready' : p.dashCooldown.toFixed(1)+'s'}</b></div>
      `;
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (game.running) update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    window.addEventListener('keydown', (e) => {
      game.keys.add(e.key.toLowerCase());
      if (e.key.toLowerCase() === 'e') pulseNova();
      if (e.key === 'Shift' && game.player && game.player.dashCooldown <= 0) {
        const p = game.player;
        const a = Math.atan2(game.mouse.y - p.y, game.mouse.x - p.x);
        p.vx += Math.cos(a) * 560;
        p.vy += Math.sin(a) * 560;
        p.dashTimer = 0.22;
        p.dashCooldown = 1.8;
        p.invuln = 0.18;
        game.screenShake = Math.max(game.screenShake, 7);
      }
    });
    window.addEventListener('keyup', (e) => game.keys.delete(e.key.toLowerCase()));

    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      game.mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
      game.mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
    });
    canvas.addEventListener('mousedown', () => game.mouse.down = true);
    window.addEventListener('mouseup', () => game.mouse.down = false);

    startBtn.addEventListener('click', () => {
      resetGame();
      game.running = true;
      overlay.classList.add('hidden');
    });

    resetGame();
    draw();
  </script>
</body>
</html>
